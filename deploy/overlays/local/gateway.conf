# What the Ingress that the operator makes does in a cluster with a controller, for kind and k3d,
# which have none: each module under its own name, what every module serves for itself (/docs,
# /openapi.yaml, /v1/attribution, /health) to the first one, and the rest to the dashboard that the
# operator serves.
#
# The services do not exist until the operator makes them, and nginx would refuse to start without
# them: their names are resolved at each request, through the DNS of the cluster.
server {
    listen 80;
    resolver kube-dns.kube-system.svc.cluster.local valid=5s;

    set $geocoder http://geko-geocoder.geko.svc.cluster.local:80;
    set $tiles    http://geko-tiles.geko.svc.cluster.local:80;
    set $operator http://geko-operator.geko.svc.cluster.local:80;

    location /geocoder/ {
        proxy_pass $geocoder;
        proxy_set_header Host $host;
    }

    location /tiles/ {
        proxy_pass $tiles;
        proxy_set_header Host $host;
    }

    location ~ ^/(docs|openapi\.yaml|v1/attribution|health)$ {
        proxy_pass $geocoder;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass $operator;
        proxy_set_header Host $host;
    }
}
