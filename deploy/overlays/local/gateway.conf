# What the Ingress does in a cluster with a controller, for kind and k3d, which have none: each
# module under its own name, the rest (/, /docs, /health, /v1/attribution) to the first module.
server {
    listen 80;

    location /tiles/ {
        proxy_pass http://geko-tiles:80;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://geko-geocoder:80;
        proxy_set_header Host $host;
    }
}
