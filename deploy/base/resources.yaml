# Generated by `geko k8s render` from geko.toml: edit that and render again, never this file.
# The config map `geko` (geko.toml and the geko-<module>.toml files) is not here: each overlay makes it.
apiVersion: "v1"
kind: "PersistentVolumeClaim"
metadata:
  labels:
    app.kubernetes.io/name: "geko"
    app.kubernetes.io/part-of: "geko"
  name: "geko-data"
spec:
  accessModes:
    - "ReadWriteMany"
  resources:
    requests:
      storage: "20Gi"
---
apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  labels:
    app.kubernetes.io/component: "geocoder"
    app.kubernetes.io/name: "geko"
    app.kubernetes.io/part-of: "geko"
  name: "geko-geocoder"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: "geocoder"
      app.kubernetes.io/name: "geko"
  template:
    metadata:
      labels:
        app.kubernetes.io/component: "geocoder"
        app.kubernetes.io/name: "geko"
        app.kubernetes.io/part-of: "geko"
    spec:
      containers:
        - args:
            - "serve"
            - "--module"
            - "geocoder"
            - "--listen"
            - "0.0.0.0:8080"
          image: "ghcr.io/candymaps/geko-geocoder:latest"
          livenessProbe:
            failureThreshold: 6
            httpGet:
              path: "/health"
              port: "http"
            periodSeconds: 10
          name: "geko"
          ports:
            - containerPort: 8080
              name: "http"
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: "/ready"
              port: "http"
            periodSeconds: 5
          volumeMounts:
            - mountPath: "/var/lib/geko"
              name: "data"
            - mountPath: "/etc/geko"
              name: "config"
              readOnly: true
      volumes:
        - name: "data"
          persistentVolumeClaim:
            claimName: "geko-data"
        - configMap:
            name: "geko"
          name: "config"
---
apiVersion: "v1"
kind: "Service"
metadata:
  labels:
    app.kubernetes.io/component: "geocoder"
    app.kubernetes.io/name: "geko"
    app.kubernetes.io/part-of: "geko"
  name: "geko-geocoder"
spec:
  ports:
    - name: "http"
      port: 80
      targetPort: "http"
  selector:
    app.kubernetes.io/component: "geocoder"
    app.kubernetes.io/name: "geko"
---
apiVersion: "batch/v1"
kind: "CronJob"
metadata:
  labels:
    app.kubernetes.io/component: "geocoder"
    app.kubernetes.io/name: "geko"
    app.kubernetes.io/part-of: "geko"
  name: "geko-build-geocoder"
spec:
  concurrencyPolicy: "Forbid"
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/component: "geocoder"
            app.kubernetes.io/name: "geko"
            app.kubernetes.io/part-of: "geko"
        spec:
          containers:
            - args:
                - "build"
                - "--module"
                - "geocoder"
              image: "ghcr.io/candymaps/geko-geocoder:latest"
              name: "geko"
              volumeMounts:
                - mountPath: "/var/lib/geko"
                  name: "data"
                - mountPath: "/etc/geko"
                  name: "config"
                  readOnly: true
          restartPolicy: "Never"
          volumes:
            - name: "data"
              persistentVolumeClaim:
                claimName: "geko-data"
            - configMap:
                name: "geko"
              name: "config"
  schedule: "0 3 1 * *"
  successfulJobsHistoryLimit: 1
---
