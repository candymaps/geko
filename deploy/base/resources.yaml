---
apiVersion: "networking.k8s.io/v1"
kind: "Ingress"
metadata:
  labels:
    app.kubernetes.io/name: "geko"
    app.kubernetes.io/part-of: "geko"
  name: "geko"
spec:
  rules:
    - http:
        paths:
          - backend:
              service:
                name: "geko-geocoder"
                port:
                  name: "http"
            path: "/geocoder/"
            pathType: "Prefix"
          - backend:
              service:
                name: "geko-tiles"
                port:
                  name: "http"
            path: "/tiles/"
            pathType: "Prefix"
          - backend:
              service:
                name: "geko-geocoder"
                port:
                  name: "http"
            path: "/"
            pathType: "Prefix"
