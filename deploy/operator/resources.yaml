# Generated by `geko k8s install`: the operator of geko, which makes the rest from the config map `geko`.
# The config map itself is not here: each overlay makes it.
apiVersion: "v1"
kind: "ServiceAccount"
metadata:
  labels:
    app.kubernetes.io/component: "operator"
    app.kubernetes.io/name: "geko"
    app.kubernetes.io/part-of: "geko"
  name: "geko-operator"
---
apiVersion: "rbac.authorization.k8s.io/v1"
kind: "Role"
metadata:
  labels:
    app.kubernetes.io/component: "operator"
    app.kubernetes.io/name: "geko"
    app.kubernetes.io/part-of: "geko"
  name: "geko-operator"
rules:
  - apiGroups:
      - ""
    resources:
      - "configmaps"
    verbs:
      - "get"
      - "list"
      - "watch"
  - apiGroups:
      - ""
    resources:
      - "services"
    verbs:
      - "get"
      - "list"
      - "watch"
      - "create"
      - "patch"
      - "delete"
  - apiGroups:
      - ""
    resources:
      - "pods"
    verbs:
      - "get"
      - "list"
  - apiGroups:
      - ""
    resources:
      - "persistentvolumeclaims"
    verbs:
      - "get"
      - "list"
      - "watch"
      - "create"
      - "patch"
  - apiGroups:
      - "apps"
    resources:
      - "deployments"
    verbs:
      - "get"
      - "list"
      - "watch"
      - "create"
      - "patch"
      - "delete"
  - apiGroups:
      - "batch"
    resources:
      - "cronjobs"
    verbs:
      - "get"
      - "list"
      - "watch"
      - "create"
      - "patch"
      - "delete"
  - apiGroups:
      - "batch"
    resources:
      - "jobs"
    verbs:
      - "get"
      - "list"
      - "watch"
      - "create"
      - "patch"
      - "delete"
  - apiGroups:
      - "networking.k8s.io"
    resources:
      - "ingresses"
    verbs:
      - "get"
      - "list"
      - "watch"
      - "create"
      - "patch"
      - "delete"
---
apiVersion: "rbac.authorization.k8s.io/v1"
kind: "RoleBinding"
metadata:
  labels:
    app.kubernetes.io/component: "operator"
    app.kubernetes.io/name: "geko"
    app.kubernetes.io/part-of: "geko"
  name: "geko-operator"
roleRef:
  apiGroup: "rbac.authorization.k8s.io"
  kind: "Role"
  name: "geko-operator"
subjects:
  - kind: "ServiceAccount"
    name: "geko-operator"
---
apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  labels:
    app.kubernetes.io/component: "operator"
    app.kubernetes.io/name: "geko"
    app.kubernetes.io/part-of: "geko"
  name: "geko-operator"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: "operator"
      app.kubernetes.io/name: "geko"
  template:
    metadata:
      labels:
        app.kubernetes.io/component: "operator"
        app.kubernetes.io/name: "geko"
        app.kubernetes.io/part-of: "geko"
    spec:
      containers:
        - args:
            - "operator"
            - "--listen"
            - "0.0.0.0:8080"
            - "--image-prefix"
            - "ghcr.io/candymaps/geko-"
            - "--tag"
            - "latest"
            - "--storage"
            - "20Gi"
            - "--access-mode"
            - "ReadWriteMany"
          image: "ghcr.io/candymaps/geko:latest"
          livenessProbe:
            httpGet:
              path: "/health"
              port: "http"
            periodSeconds: 10
          name: "geko"
          ports:
            - containerPort: 8080
              name: "http"
          readinessProbe:
            httpGet:
              path: "/ready"
              port: "http"
            periodSeconds: 5
          volumeMounts:
            - mountPath: "/etc/geko"
              name: "config"
              readOnly: true
      serviceAccountName: "geko-operator"
      volumes:
        - configMap:
            name: "geko"
          name: "config"
---
apiVersion: "v1"
kind: "Service"
metadata:
  labels:
    app.kubernetes.io/component: "operator"
    app.kubernetes.io/name: "geko"
    app.kubernetes.io/part-of: "geko"
  name: "geko-operator"
spec:
  ports:
    - name: "http"
      port: 80
      targetPort: "http"
  selector:
    app.kubernetes.io/component: "operator"
    app.kubernetes.io/name: "geko"
