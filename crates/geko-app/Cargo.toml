[package]
name = "geko-app"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "geko"
path = "src/main.rs"

# The host (docs/MODULES_PLAN.md), with the modules linked into it, each behind its feature.
[features]
default = ["geocoder", "tiles"]
geocoder = ["dep:geko-module-geocoder"]
tiles = ["dep:geko-module-tiles"]

[dependencies]
geko-module-sdk.workspace = true
geko-server.workspace = true
geko-fetch.workspace = true
geko-module-geocoder = { workspace = true, optional = true }
geko-module-tiles = { workspace = true, optional = true }
anyhow.workspace = true
clap.workspace = true
hex = "0.4"
mimalloc = { version = "0.1", default-features = false }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile = "3"
