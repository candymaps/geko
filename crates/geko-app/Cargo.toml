[package]
name = "geko-app"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

# The host, as a library that a module can link itself into for its own checks, and its binary.
[lib]
path = "src/lib.rs"

[[bin]]
name = "geko"
path = "src/main.rs"

[dependencies]
geko-artifact.workspace = true
geko-module-sdk.workspace = true
geko-server.workspace = true
geko-fetch.workspace = true
geko-kube.workspace = true
anyhow.workspace = true
clap.workspace = true
hex = "0.4"
libloading = "0.8"
mimalloc = { version = "0.1", default-features = false }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
geko-module-sdk = { workspace = true, features = ["conformance"] }
tempfile = "3"
