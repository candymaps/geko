[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-only"

[workspace.dependencies]
geko-module-sdk = { path = "crates/geko-module-sdk" }
geko-server = { path = "crates/geko-server" }
geko-fetch = { path = "crates/geko-fetch" }
geko-artifact = { path = "crates/geko-artifact" }

anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
toml = "0.8"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["catch-panic"] }
tracing = "0.1"
arc-swap = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "fat"
codegen-units = 1
# Unwind, not abort: a bug in one request must never take the whole server down.
panic = "unwind"

# For checks of hit rates, not of latency: optimised like release, but much faster to compile.
[profile.ci]
inherits = "release"
lto = "thin"
codegen-units = 16
