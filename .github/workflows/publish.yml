# The publication of what reaches main: on every push to it, the image, with the version of
# Cargo.toml, and the tag of the SDK. The checks of ci.yml are not run again: main only takes pull
# requests that passed them, up to date with it (the protection of the branch). Those of modules.yml
# are: nothing is published until this geko has run with the modules of modules.lock.
name: publish

on:
  push:
    branches: [main]

concurrency:
  group: publish
  # A publication cut halfway would leave a release without its tag.
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  modules:
    if: github.repository == 'candymaps/geko'
    uses: ./.github/workflows/modules.yml

  # Publishes in ghcr.io, with the version of Cargo.toml:
  # - if the push changed what goes into it (not only documentation), the image
  #   (ghcr.io/candymaps/geko, tag <version>-<commit>), with the modules of modules.lock;
  # - when that version has no GitHub release yet (it was raised in Cargo.toml), also the tag
  #   <version> and latest on the image, and the git tag v<version> on
  #   the pushed commit, with its GitHub release, whose notes say how to pull the image. Raising the
  #   version is how a release is made. A tag v<version> without a release (pushed by hand, or left
  #   by a cut publication) is released only if it is on the pushed commit; on another, the version
  #   must be raised.
  # GitHub's own token pushes. Not in a fork.
  publish:
    needs: modules
    if: github.repository == 'candymaps/geko'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          commit=$(git rev-parse --short HEAD)
          # A release when v<version> has none on GitHub. Any other error of gh stops the job, so
          # that a failed query does not publish a version twice.
          release=0
          if ! out=$(gh release view "v$version" 2>&1); then
            [[ $out == *"release not found"* ]] || { echo "$out" >&2; exit 1; }
            tagged=$(git rev-parse -q --verify "refs/tags/v$version^{commit}" || true)
            if [ -z "$tagged" ] || [ "$tagged" = "$(git rev-parse HEAD)" ]; then
              release=1
            else
              echo "::error::v$version is tagged on $tagged, not on this commit, and has no release: raise the version in Cargo.toml"
              exit 1
            fi
          fi
          tags="ghcr.io/candymaps/geko:$version-$commit"
          [ "$release" = 0 ] || tags="$tags,ghcr.io/candymaps/geko:$version,ghcr.io/candymaps/geko:latest"
          # A new image only when the push changed what goes into it, or makes a release. Without
          # the commit before the push (a new branch, a forced push), always.
          image=1
          before="${{ github.event.before }}"
          if [ "$release" = 0 ] && git cat-file -e "$before^{commit}" 2> /dev/null \
            && git diff --quiet "$before" HEAD -- crates Cargo.toml Cargo.lock rust-toolchain.toml Dockerfile modules.lock; then
            image=0
          fi
          {
            echo "version=$version"
            echo "commit=$commit"
            echo "release=$release"
            echo "tags=$tags"
            echo "image=$image"
          } >> "$GITHUB_OUTPUT"
      # The SDK and what the host shares with its modules (geko-fetch, geko-artifact), which the
      # modules use from their repositories as git dependencies, at the tag sdk-v<version> of their
      # version. A tag never moves: a change to any of them raises it, in the three crates.
      - if: steps.version.outputs.image == '1'
        run: |
          sdk=(crates/geko-module-sdk crates/geko-fetch crates/geko-artifact)
          version=$(sed -n 's/^version = "\([^"]*\)".*/\1/p' crates/geko-module-sdk/Cargo.toml)
          for crate in "${sdk[@]}"; do
            grep -q "^version = \"$version\"" "$crate/Cargo.toml" || { echo "::error::$crate is not at version $version of the SDK"; exit 1; }
          done
          if git rev-parse -q --verify "refs/tags/sdk-v$version^{commit}" > /dev/null; then
            git diff --quiet "sdk-v$version" HEAD -- "${sdk[@]}" || { echo "::error::the SDK changed since sdk-v$version: raise its version"; exit 1; }
          else
            git tag "sdk-v$version" HEAD
            git push origin "refs/tags/sdk-v$version"
          fi
      - if: steps.version.outputs.image == '1'
        uses: docker/setup-buildx-action@v3
      - if: steps.version.outputs.image == '1'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.version.outputs.image == '1'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.version.outputs.tags }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            REVISION=${{ steps.version.outputs.commit }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The tag goes last: if something could not be published, the next run makes the release again.
      # gh creates the tag and its GitHub release in one call, so neither is left without the other.
      # The notes start with the image of the release; GitHub appends the changes since the last one.
      - if: steps.version.outputs.release == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes \
            --notes "$(printf 'Image: `ghcr.io/candymaps/geko:%s`\n\n```\ndocker pull ghcr.io/candymaps/geko:%s\n```' "$VERSION" "$VERSION")"
