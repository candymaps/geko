# The operator mode in a kind cluster (docs/OPERATOR_MODE_PLAN.md, steps 8 and 10): the same
# `make start-dev` as a developer runs with `[deploy] mode = "operator"`, which installs the operator
# (deploy/overlays/ci, Luxembourg), and then ci/operator.sh: each module answers, the dashboard lists
# them, one that falls does not take the other, and the operator follows the config map.
# It builds both modules inside Docker from their repositories, which are public.
#
# It is not a required status of main or dev (it takes tens of minutes), and runs only for what
# can change it, or by hand.
name: operator

on:
  workflow_dispatch:
  pull_request:
    paths:
      - deploy/**
      - develop/k8s-dev.sh
      - ci/operator.sh
      - crates/geko-app/src/k8s.rs
      - crates/geko-app/src/operator.rs
      - crates/geko-kube/**
      - crates/geko-app/src/config.rs
      - crates/geko-app/src/bundle*.rs
      - crates/geko-server/**
      - Dockerfile
      - Makefile
      - .github/workflows/operator.yml

concurrency:
  group: operator-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  kind:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: candymaps/geko-geocoder
          path: modules/geko-geocoder
      - uses: actions/checkout@v4
        with:
          repository: candymaps/geko-tiles
          path: modules/geko-tiles
      # kind and kubectl are on the image of the runner.
      - run: kind version && kubectl version --client
      - env:
          GEKO_DEV_FOLLOW: "0"
        run: make start-dev DEV_CONFIG=deploy/overlays/ci/geko.toml DEV_MODULES_DIR="$PWD/modules"
      - run: ci/operator.sh
      - if: always()
        run: |
          kubectl --context kind-geko-dev -n geko get pods -o wide || true
          kubectl --context kind-geko-dev -n geko logs -l app.kubernetes.io/part-of=geko --prefix --tail=40 --max-log-requests=10 || true
      - if: always()
        run: develop/k8s-dev.sh down --purge
