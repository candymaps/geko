openapi: 3.1.0
info:
  title: geko
  version: "1"
  summary: Geocoder and vector tile server.
  description: |
    What every module of geko shares: health, metrics and the attribution of the served data.
    Each active module serves its own routes under its name (`/geocoder/…`, `/tiles/…`), with its
    own reference at `/<module>/openapi.yaml`; `/docs` browses them all.

    With `[serve] api_keys`, a request carries a key (`Authorization: Bearer`, `X-Api-Key` or
    `api_key=`), except `/`, `/health`, `/v1/attribution` and the pages of the modules.
servers:
  - url: /
    description: The geko serving this document
paths:
  /:
    get:
      summary: Leads to the page of the first active module that has one (the demo of the geocoder).
      responses:
        "303":
          description: Where the page is.
  /v1/attribution:
    get:
      summary: Licenses and attributions of the served data, and what each module adds (the derivative database notice of the geocoder, ODbL 4.6). Never needs an API key.
      responses:
        "200":
          description: Sources of the bundle and, under the name of each module, what it adds.
          content:
            application/json:
              schema:
                type: object
                properties:
                  bundle: { type: [string, "null"] }
                  contact: { type: [string, "null"], description: "Where to ask for the code that reproduces the served data ([serve] attribution_contact)." }
                  sources:
                    type: array
                    items:
                      type: object
                      properties:
                        source: { type: string }
                        license: { type: string }
                        attribution: { type: string }
                        url: { type: [string, "null"] }
                  geocoder:
                    type: object
                    properties:
                      derivative_database:
                        type: object
                        properties:
                          license: { type: string }
                          notice: { type: string }
                          method: { type: string, description: Path of the description of the fusion method. }
  /openapi.yaml:
    get:
      summary: This document.
      responses:
        "200":
          description: The OpenAPI reference of what every module shares.
          content:
            application/yaml: {}
  /docs:
    get:
      summary: This document and those of the active modules, browsable (Swagger UI).
      responses:
        "200":
          description: An HTML page that loads Swagger UI from cdn.jsdelivr.net and reads every reference.
          content:
            text/html: {}
  /health:
    get:
      summary: Liveness, active modules and the bundle being served.
      responses:
        "200":
          description: The server is up.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: ok }
                  modules: { type: array, items: { type: string, enum: [geocoder, tiles] } }
                  bundle: { type: [string, "null"], description: Version of the bundle served; null before the first one is published. }
  /metrics:
    get:
      summary: Metrics in the Prometheus text format.
      description: |
        `geko_requests_total{route,status}` (status class `2xx`…`5xx`),
        `geko_request_seconds{route}` (latency histogram), `geko_bundle_info{version}` and
        `geko_uptime_seconds`. `route` is the route pattern (`/geocoder/v1/place/{id}`), not the path.
        The modules add their own (`geko_merged_duplicates_total`, `geko_cache_lookups_total`…).
      responses:
        "200":
          description: The metrics.
          content:
            text/plain:
              schema: { type: string }
