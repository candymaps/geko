<style>
  .search-input-wrap {
    border-right: 1px solid #eeebee;
  }
  .aux-icon {
    width: 1.25rem;
    height: 1.25rem;
    fill: currentColor;
  }
  .search-input-wrap::after {
    content: "Ctrl K";
    position: absolute;
    top: 50%;
    right: 0.75rem;
    padding: 0.1em 0.4em;
    transform: translateY(-50%);
    border: 1px solid #eeebee;
    border-radius: 4px;
    background-color: #f5f6fa;
    color: #5c5962;
    font: 0.7rem/1.4 "SFMono-Regular", Menlo, Consolas, monospace;
    pointer-events: none;
  }
  html[data-mac] .search-input-wrap::after {
    content: "\2318 K";
  }
  .search-input-wrap:focus-within::after,
  .search-input-wrap:has(.search-input:not(:placeholder-shown))::after {
    display: none;
  }
</style>
<script>
  if (/Mac|iPhone|iPad/.test(navigator.platform)) document.documentElement.setAttribute("data-mac", "");
  document.addEventListener("keydown", function (e) {
    if (!(e.ctrlKey || e.metaKey) || e.altKey || e.shiftKey || e.key.toLowerCase() !== "k") return;
    var input = document.getElementById("search-input");
    if (!input) return;
    // The browser binds Ctrl+K to its own search bar.
    e.preventDefault();
    input.focus();
    input.select();
  });
  // The tooltip goes on the whole button, not only on the icon (a <title> inside the SVG would).
  document.addEventListener("DOMContentLoaded", function () {
    document.querySelectorAll(".aux-nav a").forEach(function (link) {
      var icon = link.querySelector("svg[aria-label]");
      if (icon) link.title = icon.getAttribute("aria-label");
    });
  });
  // On keyup, so that the theme clears the field first (it does that on Esc).
  document.addEventListener("DOMContentLoaded", function () {
    var input = document.getElementById("search-input");
    if (input) input.addEventListener("keyup", function (e) {
      if (e.key === "Escape") input.blur();
    });
  });
</script>
