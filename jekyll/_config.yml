title: geko
description: A modular, multi-country geospatial engine.
url: https://candymaps.github.io
baseurl: /geko

remote_theme: just-the-docs/just-the-docs@v0.10.1
plugins:
  - jekyll-remote-theme

search_enabled: true
heading_anchors: true
color_scheme: light

aux_links:
  GitHub:
    - https://github.com/candymaps/geko
aux_links_new_tab: true

gh_edit_link: true
gh_edit_link_text: Edit this page on GitHub
gh_edit_repository: https://github.com/candymaps/geko
gh_edit_branch: dev
gh_edit_source: jekyll
gh_edit_view_mode: edit

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
