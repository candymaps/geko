# Configuration of `make start-dev` (develop/compose.yaml), and of `make install` the first time:
# development only. The published image carries none: it is mounted at /etc/geko/geko.toml.
# The options of the geocoder (its sources, time budgets, cache…) go in
# /etc/geko/geko-geocoder.toml, beside it (develop/geko-geocoder.toml in the repository of the
# geocoder lists them all); without it, every default.

[modules]
geocoder = true
tiles    = false

[[scope]]
country = "ES"          # ISO 3166-1; regions = ["ES-PM"] narrows a country to some regions
regions = ["ES-PM"]

[data]
# Accepted for development: the licences of the sources (ODbL for OpenStreetMap, CDLA-Permissive
# for Overture, those of the national sources). The downloads are kept, so that a staging done
# again does not download them again.
accept_licenses = true
keep_downloads  = true

# The image serves on 0.0.0.0:8080 whatever [serve] listen says (the command of the Dockerfile).
[serve]
listen = "0.0.0.0:8080"

# single: every module in the container of make start-dev. operator: one pod per module in a local
# cluster (docs/OPERATOR_MODE_PLAN.md); make start-dev follows it once that step is done.
[deploy]
mode = "single"
