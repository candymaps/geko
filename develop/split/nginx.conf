# The Ingress of develop/compose-split.yaml: what the Ingress or HTTPRoute of the operator mode
# does, by the path. Each module serves under its own name; the rest (/, /docs, /health,
# /v1/attribution, /metrics) is common to every process, so any of them answers it.
#
# The router is optional (--profile router) and nginx would refuse to start without it: its name is
# resolved at each request, through the DNS of Docker.
server {
    listen 80;
    resolver 127.0.0.11 valid=5s;

    set $router http://router:8080;

    location /tiles/ {
        proxy_pass http://tiles:8080;
        proxy_set_header Host $host;
    }

    location /router/ {
        proxy_pass $router;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://geocoder:8080;
        proxy_set_header Host $host;
    }
}
