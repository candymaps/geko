# geko of the working tree, uncommitted changes included, in one container: `make start-dev` (which
# fills the variables below), or by hand from the root of the repository:
#
#   GEKO_DEV_CONFIG=~/geko-dev.toml docker compose -f develop/compose.yaml up --build
#
# The image (target `local` of the Dockerfile) carries geko and the modules of GEKO_DEV_MODULES,
# built inside Docker on the Debian of the published image, and never downloads a module: one
# active in the configuration but not built in is an error. The country packs are those of the
# repository, never downloaded either. Everything is grouped under the project geko-dev.
#
#   GEKO_DEV_CONFIG    the geko.toml (default: develop/geko.toml, the sample of the image, which
#                      does not accept the licences: use your own, outside the repository)
#   GEKO_DEV_MODULES   the modules to build, comma-separated (default: geocoder)
#   GEKO_DEV_VERSION   the version the modules say they are, in the bundles they build
#                      (make start-dev: <version>-<commit>[-dirty])
#   GEKO_DEV_PORT      the port on this machine (default: 8080)
name: geko-dev

services:
  geko:
    build:
      context: ..
      target: local
      args:
        MODULES: ${GEKO_DEV_MODULES:-geocoder}
        GEKO_MODULE_VERSION: ${GEKO_DEV_VERSION:-}
    image: geko:dev
    ports:
      - "${GEKO_DEV_PORT:-8080}:8080"
    volumes:
      - data:/var/lib/geko
      - ${GEKO_DEV_CONFIG:-./geko.toml}:/etc/geko/geko.toml:ro
      - ../countries:/packs:ro
    environment:
      GEKO_PACKS: /packs

volumes:
  data:
